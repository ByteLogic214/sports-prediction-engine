name: Dynamic Training, Testing & Export Pipeline

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * *' # Se ejecuta automáticamente todos los días a las 04:00 UTC
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la pestaña Actions

jobs:
  train-test-export:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Entrenamiento y Exportación de Modelos
      env:
        THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
      run: |
        python train_and_export.py

    - name: Ejecutar Pruebas Automatizadas con Pytest
      env:
        THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
      run: |
        pytest test_main.py

    - name: Guardar Modelos como Artefacto en GitHub
      uses: actions/upload-artifact@v4
      with:
        name: saved-models-artifact
        path: saved_models/

name: Build and Package Docker Image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-docker:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validar compilación de imagen Docker
      run: |
        docker build -t sports-prediction-api:latest .

    - name: Probar ejecución del contenedor en runner
      run: |
        docker run -d -p 8000:8000 --name test_container -e THESTATSAPI_KEY="${{ secrets.THESTATSAPI_KEY }}" sports-prediction-api:latest
        sleep 5
        docker ps | grep test_container
        docker stop test_container
